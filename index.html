<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10334a">
  <meta name="description" content="Solitaire Klondike gratuito, sem anúncios e jogável offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Solitaire — Noite Estrelada</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">SOLITAIRE KLONDIKE</p><h1>Noite Estrelada</h1></div>
      <button class="icon-button" id="themeButton" aria-label="Trocar tema" title="Tema">✦</button>
    </header>
    <section class="toolbar" aria-label="Opções de jogo">
      <div class="segmented" aria-label="Cartas compradas por vez"><button data-draw="1" class="selected">1 carta</button><button data-draw="3">3 cartas</button></div>
      <button id="newGame" class="action">Novo jogo</button>
      <button id="undo" class="quiet" aria-label="Desfazer jogada">↶</button>
    </section>
    <section class="tableau" aria-label="Tabuleiro de Solitaire">
      <div class="top-row"><div class="piles"><button class="pile stock" id="stock" aria-label="Comprar cartas"></button><button class="pile waste" id="waste" aria-label="Descarte"></button></div><div class="foundations" id="foundations"></div></div>
      <div class="columns" id="columns"></div>
    </section>
    <footer><span id="status" aria-live="polite">Toque numa carta para jogar.</span><span id="moves">0 jogadas</span></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
